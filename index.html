const actions = {
  'scroll'(t) { const id = t.dataset.target; lpMenu(false); const jump = () => { const el = document.getElementById(id); el && window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 60, behavior: 'smooth' }); }; if (parse().path !== '/') { go('/'); setTimeout(jump, 80); } else jump(); },
  'skip'() { const m = $('#main'); if (m) { m.tabIndex = -1; m.focus(); } },
  'ann-close'() { ui.annClosed = true; store.set('annClosed', true); const a = $('#ann'); a && a.remove(); },
  'lp-menu'() { lpMenu(!document.body.classList.contains('l-menu-open')); },
  'lp-faq'(t) { const open = t.getAttribute('aria-expanded') === 'true'; $$('.l-faq-q').forEach(b => b.setAttribute('aria-expanded', 'false')); t.setAttribute('aria-expanded', String(!open)); },
  'lnav-toggle'(t) { const o = $('#lnav').classList.toggle('open'); t.setAttribute('aria-expanded', o); t.setAttribute('aria-label', o ? 'Close menu' : 'Open menu'); },
  'faq'(t) { t.setAttribute('aria-expanded', t.getAttribute('aria-expanded') !== 'true'); },
  'toggle-pw'(t) { const i = $('#' + t.dataset.for), show = i.type === 'password'; i.type = show ? 'text' : 'password'; t.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); t.innerHTML = ic(show ? 'eye-off' : 'eye'); icons(); },
  'fill-demo'() { $('#l-email').value = DEMO.email; $('#l-pw').value = DEMO.password; toast('Demo credentials filled in.', 'info'); },
  'menu'(t) { const m = t.parentElement.querySelector('.menu'), open = m.hidden; closeMenus(); m.hidden = !open; t.setAttribute('aria-expanded', open); },
  'modal-bg'(t, e) { if (e.target === t) closeModal(); },
  'modal-close'() { closeModal(); },
  'nav-open'() { $('#shell').classList.add('nav-open'); },
  'nav-close'() { $('#shell').classList.remove('nav-open'); },
  'side-collapse'(t) { const c = $('#shell').classList.toggle('col'); store.set('sideCol', c); t.setAttribute('aria-label', (c ? 'Expand' : 'Collapse') + ' sidebar'); },
  'notif-read'() { store.set('notifRead', true); const d = $('#ndot'); d && d.remove(); toast('Notifications marked as read.'); },
  'logout'() { authService.logout(); toast('Signed out.', 'info'); go('/login'); },
  'suggest'(t) { handleSend(t.dataset.q); },
  'comp-clear'() { const ta = $('#comp-t'); ta.value = ''; ui.draft = ''; syncComposer(); ta.focus(); },
  'attach'() { openModal({ title: 'File upload is not connected yet', body: `<p>Uploading and indexing documents needs the server integration. In this preview nothing is uploaded, and no file is added to your knowledge sources.</p><p style="margin-top:10px">You can browse the sample documents under Knowledge Sources.</p>`, ok: 'Browse sample sources', cancel: 'Close', onOk: () => go('/app/sources') }); },
  'cite'(t) { const { m } = conversationService.findMsg(t.dataset.mid); const n = +t.dataset.n; if (!m || !m.cites[n - 1]) return; ui.panel = { ...m.cites[n - 1], n }; $('#chat').classList.add('has-panel'); $('#spanel').innerHTML = panelHTML(); icons(); const b = $('#spanel button'); b && b.focus(); },
  'panel-close'() { ui.panel = null; $('#chat').classList.remove('has-panel'); },
  'copy-msg'(t) { const { m } = conversationService.findMsg(t.dataset.mid); if (!m) return; let txt = m.text.replace(/\s?\[\d+\]/g, ''); if (t.dataset.with && m.cites.length) txt = m.text + '\n\nSources:\n' + m.cites.map((c, i) => `[${i + 1}] ${sourceService.get(c.s).title}`).join('\n'); const done = () => toast('Response copied.'); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(done).catch(() => toast('Copy is not available in this browser.', 'err')); },
  'feedback'(t) { const { c, m } = conversationService.findMsg(t.dataset.mid); if (!m) return; const v = m.feedback === t.dataset.v ? null : t.dataset.v; conversationService.update(c.id, x => { x.messages.find(y => y.id === m.id).feedback = v; }); refreshChat(); toast(v ? 'Feedback saved on this device.' : 'Feedback removed.'); },
  'report'() { toast('Reporting needs the server integration. Nothing was sent.', 'info'); },
  'regen'(t) { const { c, m } = conversationService.findMsg(t.dataset.mid); if (!m || pending.has(c.id)) return; const q = [...c.messages].reverse().find(x => x.role === 'user'); conversationService.update(c.id, x => { x.messages = x.messages.filter(y => y.id !== m.id); }); pending.add(c.id); refreshChat(); chatService.reply(q ? q.text : '', m.scope || 'all', (m.variant || 0) + 1, m.kb).then(msg => finishReply(c.id, msg)); },
  'edit-msg'(t) { const { c, m } = conversationService.findMsg(t.dataset.mid); if (!m || pending.has(c.id)) return; conversationService.update(c.id, x => { x.messages = x.messages.slice(0, x.messages.findIndex(y => y.id === m.id)); }); ui.draft = m.text; refreshChat(); const ta = $('#comp-t'); ta.value = m.text; syncComposer(); ta.focus(); toast('Edit your question and send it again.', 'info'); },
  'rename'(t) { const c = conversationService.get(t.dataset.id); if (!c) return; promptDialog('Rename conversation', 'Title', c.title, v => { conversationService.rename(c.id, v); toast('Conversation renamed.'); render(); }); },
  'delete-conv'(t) { const c = conversationService.get(t.dataset.id); if (!c) return; confirmDialog('Delete this conversation?', `"${c.title}" will be removed from this device. This cannot be undone.`, 'Delete', () => { conversationService.remove(c.id); pending.delete(c.id); toast('Conversation deleted.'); if (parse().path === '/app/chat/' + c.id) go('/app/chat'); else render(); }); },
  'hist-view'(t) { ui.hist.view = t.dataset.v; render(); },
  'hist-clear'() { ui.hist = { ...ui.hist, q: '', date: 'all', type: 'all', sort: 'newest' }; render(); },
  'src-type'(t) { ui.src.type = t.dataset.v; ui.src.shown = 6; render(); },
  'src-more'() { ui.src.shown += 6; $('#src-list').innerHTML = srcListHTML(); icons(); },
  'src-clear'() { ui.src = { q: '', type: 'all', sort: 'newest', shown: 6 }; render(); },
  'src-tag'(t) { ui.src = { q: t.dataset.v, type: 'all', sort: 'newest', shown: 6 }; go('/app/sources'); },
  'profile-cancel'() { render(); toast('Changes discarded.', 'info'); },
  'set-tab'(t) { ui.setTab = t.dataset.v; render(); },
  'set-seg'(t) { settingsService.set(t.dataset.key, t.dataset.v); render(); toast('Preference saved.'); },
  'clear-convs'() { confirmDialog('Clear all local demo conversations?', 'Every conversation saved in this browser will be removed. This cannot be undone.', 'Clear conversations', () => { conversationService.clear(); pending.clear(); toast('Local conversations cleared.'); render(); }); },
  'reset-convs'() { conversationService.reset(); toast('Sample conversations restored.'); render(); }
};
document.addEventListener('click', e => {
  if (!e.target.closest('.menu-wrap')) closeMenus();
  const t = e.target.closest('[data-action]'); if (!t) { if (e.target.closest('.snav a, .recents a')) { const s = $('#shell'); s && s.classList.remove('nav-open'); } return; }
  const fn = actions[t.dataset.action]; if (!fn) return;
  if (t.tagName === 'A' && !(t.getAttribute('href') || '').startsWith('#/')) e.preventDefault();
  const inMenu = t.closest('.menu'); fn(t, e); if (inMenu) closeMenus();
});

/* ==========================================================================
   FORMS / INPUT / KEYBOARD
   ========================================================================== */
const forms = {
  async login(f) {
    const email = $('#l-email').value.trim(), pw = $('#l-pw').value; $('#form-alert').innerHTML = '';
    const ok = [setErr('l-email', !email ? 'Enter your email.' : !isEmail(email) ? 'Enter a valid email address.' : ''), setErr('l-pw', !pw ? 'Enter your password.' : '')].every(Boolean);
    if (!ok) return; const btn = $('button.btn-pri', f); btnLoad(btn, true);
    const res = await authService.login(email, pw, $('#l-rem').checked); btnLoad(btn, false);
    if (!res.ok) { $('#form-alert').innerHTML = `<div class="alert err" role="alert">${ic('alert-circle')}<span>${esc(res.error)} Use the demo account shown below.</span></div>`; icons(); return; }
    toast('Signed in to the demo workspace.'); const to = ui.redirect || '/app'; ui.redirect = null; go(to);
  },
  async register(f) {
    const v = id => $('#' + id).value.trim(), pw = $('#r-pw').value, pw2 = $('#r-pw2').value;
    const ok = [setErr('r-name', v('r-name').length < 2 ? 'Enter your full name.' : ''), setErr('r-email', !isEmail(v('r-email')) ? 'Enter a valid email address.' : ''), setErr('r-code', !v('r-code') ? 'Enter your invitation code.' : ''),
      setErr('r-pw', pw.length < 8 ? 'Use at least 8 characters.' : !/[A-Za-z]/.test(pw) || !/\d/.test(pw) ? 'Include at least one letter and one number.' : ''), setErr('r-pw2', pw2 !== pw ? 'The passwords do not match.' : ''), setErr('r-terms', !$('#r-terms').checked ? 'Accept the terms to continue.' : '')].every(Boolean);
    if (!ok) { const bad = $('[aria-invalid=true]', f); bad && bad.focus(); return; }
    const btn = $('button.btn-pri', f); btnLoad(btn, true);
    const res = await authService.register({ name: v('r-name'), email: v('r-email'), code: v('r-code') }); btnLoad(btn, false);
    if (!res.ok) { setErr(res.field, res.error); $('#' + res.field).focus(); return; }
    toast('Demo account created. Welcome, ' + v('r-name').split(' ')[0] + '.'); go('/app');
  },
  async forgot(f) {
    const email = $('#f-email').value.trim(); if (!setErr('f-email', !isEmail(email) ? 'Enter a valid email address.' : '')) return;
    const btn = $('button.btn-pri', f); btnLoad(btn, true); await wait(800); btnLoad(btn, false);
    $('#form-alert').innerHTML = `<div class="alert info" role="status">${ic('info')}<span>Demo only: no email was sent to ${esc(email)}. Password reset needs the server integration. To continue, sign in with the demo account.</span></div>`; icons();
  },
  send() { handleSend($('#comp-t').value); },
  modal() { if (modalOk && modalOk() === false) return; closeModal(); },
  profile() {
    const name = $('#p-name').value.trim(), email = $('#p-email').value.trim();
    if (![setErr('p-name', name.length < 2 ? 'Enter your full name.' : ''), setErr('p-email', !isEmail(email) ? 'Enter a valid email address.' : '')].every(Boolean)) return;
    authService.saveUser({ ...authService.user(), name, email, timezone: $('#p-tz').value, language: $('#p-lang').value }); toast('Changes saved.'); render();
  }
};
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); forms[f.dataset.form] && forms[f.dataset.form](f); });

let debounce;
const inputs = {
  'comp'(t) { ui.draft = t.value; syncComposer(); },
  'side-q'(t) { ui.sideQ = t.value; $('#recents').innerHTML = recentsHTML(); },
  'hist-q'(t) { ui.hist.q = t.value; clearTimeout(debounce); debounce = setTimeout(() => { $('#hist-list').innerHTML = histListHTML(); icons(); }, 120); },
  'src-q'(t) { ui.src.q = t.value; ui.src.shown = 6; clearTimeout(debounce); debounce = setTimeout(() => { $('#src-list').innerHTML = srcListHTML(); icons(); }, 120); }
};
document.addEventListener('input', e => { const k = e.target.dataset.input; if (k && inputs[k]) inputs[k](e.target); else if (e.target.getAttribute('aria-invalid') === 'true') setErr(e.target.id, ''); });
const changes = {
  'scope'(t) { ui.scope = t.value; },
  'hist'(t) { ui.hist[t.dataset.key] = t.value; $('#hist-list').innerHTML = histListHTML(); icons(); },
  'src-sort'(t) { ui.src.sort = t.value; $('#src-list').innerHTML = srcListHTML(); icons(); },
  'set'(t) { const v = t.type === 'checkbox' ? t.checked : t.value; settingsService.set(t.dataset.key, v); if (t.dataset.key === 'defaultScope') ui.scope = v; toast('Preference saved.'); }
};
document.addEventListener('change', e => { const k = e.target.dataset.change; k && changes[k] && changes[k](e.target); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (overlay.innerHTML) return closeModal(); if ($('.menu:not([hidden])')) return closeMenus(); if (ui.panel) return actions['panel-close'](); const s = $('#shell'); s && s.classList.remove('nav-open'); lpMenu(false); return; }
  if (e.key === 'Tab' && overlay.innerHTML) { const f = $$('button, input, a[href], select', overlay).filter(x => !x.disabled); if (!f.length) return; const first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } return; }
  if (e.target.id === 'comp-t' && e.key === 'Enter' && !e.isComposing) { const ets = settingsService.get().enterToSend; if ((ets && !e.shiftKey) || (!ets && (e.ctrlKey || e.metaKey))) { e.preventDefault(); handleSend(e.target.value); } }
});

/* ==========================================================================
   BOOT
   ========================================================================== */
settingsService.apply();
if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener && mq.addEventListener('change', () => settingsService.apply()); }
render();
</script>
</body>
</html>
